<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
  <title id="title">Green RSS badge with star</title>
  <desc id="desc">Glossy rounded green square with white RSS signal arcs and a gold star.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#69f238"/><stop offset=".46" stop-color="#09ca37"/><stop offset="1" stop-color="#008c46"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#91ff42"/><stop offset=".5" stop-color="#00c633"/><stop offset="1" stop-color="#00872d"/></linearGradient>
    <radialGradient id="glow" cx="22%" cy="14%" r="78%"><stop offset="0" stop-color="#d8ffba" stop-opacity=".8"/><stop offset=".28" stop-color="#77fa55" stop-opacity=".26"/><stop offset=".72" stop-color="#00ae3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f4f4"/></linearGradient>
    <radialGradient id="gold" cx="34%" cy="18%" r="90%"><stop stop-color="#fff9ad"/><stop offset=".32" stop-color="#ffe743"/><stop offset="1" stop-color="#f5a100"/></radialGradient>
    <filter id="blur" x="-25%" y="-25%" width="160%" height="170%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect x="21" y="27" width="1057" height="1041" rx="238" fill="url(#rim)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="url(#bg)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="url(#glow)"/>
  <path d="M85 251C85 135 183 51 293 51h510c141 0 253 114 253 254v90C957 213 847 155 695 155H305c-100 0-185 37-220 96Z" fill="#b7ff9a" opacity=".18" filter="url(#soft)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="none" stroke="#8eff62" stroke-opacity=".2" stroke-width="2"/>

