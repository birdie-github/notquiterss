name: Qt builds (Qt 5 Linux, Qt 6 Windows/macOS)
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: fedora:44
    strategy:
      matrix:
        include:
          - compiler: g++
            spec: linux-g++
          - compiler: clang++
            spec: linux-clang
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git python3 gcc-c++ clang lld make pkgconf-pkg-config qt5-qtbase-devel qt5-qttools-devel qtsingleapplication-qt5-devel sqlite-devel libxml2-devel
      - uses: actions/checkout@v4
      - name: Prepare miniaudio
        run: |
          python3 scripts/prepare-miniaudio.py --prefix "$RUNNER_TEMP/miniaudio-snapshot"
          echo "MINIAUDIO_INCLUDE_DIR=$RUNNER_TEMP/miniaudio-snapshot/include" >> "$GITHUB_ENV"
      - name: Build
        run: |
          mkdir _build
          cd _build
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release QMAKE_LFLAGS+=-fuse-ld=lld
          else
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release
          fi
          make -j2

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ntldd
      - name: Prepare external QtSingleApplication and build
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m /ucrt64/lib/pkgconfig)"
          dep_work="$(cygpath -m "$RUNNER_TEMP/app-deps")"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake qmake6 --make mingw32-make
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          qmake6 ../app.pro USE_QT=6 CONFIG+=release CONFIG-=debug_and_release
          mingw32-make -j2
          mingw32-make install
          python3 ../scripts/stage-resources.py --source .. --build-dir release --verify-windows release/target
          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_EXECUTABLE="+d["executable"]); print("PROJECT_QT_TRANSLATIONS="+d["root"]+"/"+d["qtTranslations"])' >> "$GITHUB_ENV"

      - name: Deploy with windeployqt
        run: |
          DEPLOY_DIR=release/target
          EXE="$DEPLOY_DIR/$PROJECT_EXECUTABLE.exe"

          cd _build
          # Deploy into the same folder that contains the executable
          # --release          → only release DLLs
          # --compiler-runtime → copy MinGW/UCRT runtime DLLs
          # --verbose 1        → useful log in the Actions output
          windeployqt6 \
            --release \
            --compiler-runtime \
            --translationdir "$(cygpath -m "$PWD/$DEPLOY_DIR/$PROJECT_QT_TRANSLATIONS")" \
            --no-opengl-sw \
            --verbose 1 \
            "$EXE"

          echo "=== Collecting MSYS2 runtime dependencies ==="

          find "$DEPLOY_DIR" \
            \( -iname '*.exe' -o -iname '*.dll' \) \
            -print0 |
          while IFS= read -r -d '' binary; do
            ntldd -R "$binary" 2>/dev/null || true
          done |
          awk '$2 == "=>" {
            name=$1
            path=$3
            gsub(/\\/, "/", path)

            if (tolower(path) ~ /\/ucrt64\/bin\//)
              print name
          }' |
          sort -fu |
          while IFS= read -r dll; do
            src="/ucrt64/bin/$dll"

            if [ -f "$src" ]; then
              if [ ! -f "$DEPLOY_DIR/$dll" ]; then
                cp -a "$src" "$DEPLOY_DIR/"
                echo "Copied $dll"
              fi
            else
              echo "WARNING: unresolved MSYS2 dependency: $dll"
            fi
          done

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Windows-${{ github.sha }}
          path: _build/release/target/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Apple Silicon package (Qt 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt sqlite libxml2 pkgconf python
      - name: Prepare external QtSingleApplication and build
        run: |
          set -euo pipefail
          qt_bin="$(brew --prefix qt)/bin"
          export PATH="$qt_bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig"
          dep_work="$RUNNER_TEMP/app-deps"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake "$qt_bin/qmake"
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          "$qt_bin/qmake" ../app.pro USE_QT=6 CONFIG+=release CONFIG-=debug_and_release
          make -j2
          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_VERSION="+d["version"]); print("PROJECT_EXECUTABLE="+d["executable"])' >> "$GITHUB_ENV"

      - name: Deploy, sign and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          qt_bin="$(brew --prefix qt)/bin"
          export PATH="$qt_bin:$PATH"
          cd _build/release/target
          bundle="$PROJECT_NAME.app"
          test -d "$bundle"
          test "$(uname -m)" = arm64
          lipo "$bundle/Contents/MacOS/$PROJECT_EXECUTABLE" -verify_arch arm64

          # Include the notices supplied by our external dependency helpers.
          mkdir -p "$bundle/Contents/Resources/licenses"
          cp -R "$RUNNER_TEMP/app-deps/install/share/licenses/qtsingleapplication" "$bundle/Contents/Resources/licenses/"
          cp -R "$RUNNER_TEMP/app-deps/miniaudio/share/licenses/miniaudio" "$bundle/Contents/Resources/licenses/"

          # Homebrew installs Qt modules separately; plugins can reference
          # frameworks outside qtbase. Do not overwrite already-fixed libraries
          # when macdeployqt encounters them again through another plugin.
          brew_prefix="$(brew --prefix)"
          "$qt_bin/macdeployqt" "$bundle" \
            -libpath="$brew_prefix/lib" \
            -libpath="$(brew --prefix qt)/lib" \
            -libpath="$(brew --prefix sqlite)/lib" \
            -libpath="$(brew --prefix libxml2)/lib" \
            -verbose=2 -no-codesign
          test -f "$bundle/Contents/PlugIns/platforms/libqcocoa.dylib"
          test -f "$bundle/Contents/PlugIns/sqldrivers/libqsqlite.dylib"

          # Some transitive Homebrew references survive deployment even when
          # their libraries were copied. Repair only references with an existing
          # bundle counterpart; never leave a dependency on the build machine.
          while IFS= read -r -d '' binary; do
            file_type="$(file -b "$binary")"
            [[ "$file_type" == *Mach-O* ]] || continue
            dependencies="$(otool -L "$binary")"
            install_id="$(otool -D "$binary" | tail -n +2)"
            while IFS= read -r dependency; do
              case "$dependency" in
                "$brew_prefix"/*)
                  case "$dependency" in
                    *.framework/*)
                      relative="${dependency#*/lib/}"
                      ;;
                    *) relative="${dependency##*/}" ;;
                  esac
                  target="$bundle/Contents/Frameworks/$relative"
                  if [ ! -f "$target" ]; then
                    echo "Missing bundled dependency for $binary: $dependency" >&2
                    exit 1
                  fi
                  replacement="@executable_path/../Frameworks/$relative"
                  if [ "$dependency" = "$install_id" ]; then
                    install_name_tool -id "$replacement" "$binary"
                  else
                    install_name_tool -change "$dependency" "$replacement" "$binary"
                  fi
                  ;;
              esac
            done <<< "$(printf '%s\n' "$dependencies" | sed -n '2,$s/^[[:space:]]*\(.*\) (compatibility version.*$/\1/p')"
          done < <(find "$bundle" -type f -print0)

          # Reject binaries still linked to Homebrew or another build-host path.
          # System libraries and bundle-relative install names are allowed.
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              otool -L "$binary" | tail -n +2 | awk -v binary="$binary" '
                $1 ~ /^\// && $1 !~ /^\/(System\/Library|usr\/lib)\// {
                  print "Unbundled dependency in " binary ": " $0; bad=1
                }
                END { exit bad }
              '
            fi
          done < <(find "$bundle" -type f -print0)
          # All binary edits must precede signing. Deep signing is intentional
          # for this ad-hoc beta bundle, not a Developer ID/notarization workflow.
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          dmg_stage="$(mktemp -d "$RUNNER_TEMP/notquiterss-dmg.XXXXXX")"
          ditto "$bundle" "$dmg_stage/$bundle"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -volname "$PROJECT_NAME" -srcfolder "$dmg_stage" \
            -format UDZO "$PROJECT_NAME.dmg"
          hdiutil verify "$PROJECT_NAME.dmg"
          mkdir -p ../../artifacts
          mv "$PROJECT_NAME.dmg" "../../artifacts/$PROJECT_NAME-$PROJECT_VERSION-macOS-arm64.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-macOS-arm64-${{ github.sha }}
          path: _build/artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
