name: Qt builds and packages
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: fedora:44
    strategy:
      matrix:
        include:
          - compiler: g++
            spec: linux-g++
          - compiler: clang++
            spec: linux-clang
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git python3 gcc-c++ clang lld make pkgconf-pkg-config qt5-qtbase-devel qt5-qtsvg-devel qt5-qttools-devel qtsingleapplication-qt5-devel sqlite-devel libxml2-devel
      - uses: actions/checkout@v4
      - name: Test resource staging and translation build
        run: |
          python3 tests/resources/test_resources.py
          python3 tests/resources/test_qt_translations.py
          python3 tests/resources/test_translation_build.py --qmake qmake-qt5
      - name: Test cookie storage (Qt 5)
        run: |
          mkdir _cookie_tests
          cd _cookie_tests
          qmake-qt5 -spec ${{ matrix.spec }} ../tests/cookies/cookies.pro
          make -j"$(nproc)"
          ./cookies-test
      - name: Prepare miniaudio
        run: |
          python3 scripts/prepare-miniaudio.py --prefix "$RUNNER_TEMP/miniaudio-snapshot"
          echo "MINIAUDIO_INCLUDE_DIR=$RUNNER_TEMP/miniaudio-snapshot/include" >> "$GITHUB_ENV"
      - name: Build
        run: |
          mkdir _build
          cd _build
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release QMAKE_LFLAGS+=-fuse-ld=lld CONFIG+=lto
          else
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release CONFIG+=lto
          fi
          make -j"$(nproc)"

  appimage:
    name: Linux AppImage (Qt 6, x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 wget file pkg-config libxml2-dev libsqlite3-dev \
            qt6-base-dev libqt6svg6-dev qt6-tools-dev-tools qt6-l10n-tools libqt6core5compat6-dev libgl-dev \
            libqt6sql6-sqlite

      - name: Test cookie storage (Qt 6)
        run: |
          mkdir _cookie_tests
          cd _cookie_tests
          qmake6 ../tests/cookies/cookies.pro
          make -j"$(nproc)"
          ./cookies-test

      - name: Prepare dependencies and build
        run: |
          set -euo pipefail
          dep_work="$RUNNER_TEMP/app-deps"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake qmake6
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"

          mkdir _build
          cd _build
          qmake6 ../app.pro USE_QT=6 PREFIX=/usr CONFIG+=release CONFIG-=debug_and_release CONFIG+=lto
          make -j"$(nproc)"
          make INSTALL_ROOT="$PWD/AppDir" install

          mkdir -p AppDir/usr/share/NotQuiteRSS/licenses
          cp -R "$dep_work/install/share/licenses/qtsingleapplication" AppDir/usr/share/NotQuiteRSS/licenses/
          cp -R "$dep_work/miniaudio/share/licenses/miniaudio" AppDir/usr/share/NotQuiteRSS/licenses/

          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_VERSION="+d["version"])' >> "$GITHUB_ENV"

      - name: Package AppImage
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools" _build/artifacts
          wget -q -O "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage

          export PATH="$tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=qmake6
          export LDAI_OUTPUT="$PWD/_build/artifacts/$PROJECT_NAME-$PROJECT_VERSION-Linux-x86_64.AppImage"
          export MKSQUASHFS_ARGUMENTS="-comp zstd -Xcompression-level 22 -b 1M"

          "$tools/linuxdeploy-x86_64.AppImage" \
            --appdir _build/AppDir \
            --desktop-file "_build/AppDir/usr/share/applications/$PROJECT_NAME.desktop" \
            --icon-file "_build/AppDir/usr/share/icons/hicolor/256x256/apps/$PROJECT_NAME.png" \
            --plugin qt \
            --output appimage

          test -f "$LDAI_OUTPUT"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Linux-AppImage-x86_64-${{ github.sha }}
          path: _build/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ntldd
      - name: Test resource staging
        run: |
          python3 tests/resources/test_resources.py
          python3 tests/resources/test_qt_translations.py
          python3 tests/resources/test_translation_build.py --qmake qmake6 --make mingw32-make
      - name: Prepare external QtSingleApplication and build
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m /ucrt64/lib/pkgconfig)"
          dep_work="$(cygpath -m "$RUNNER_TEMP/app-deps")"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake qmake6 --make mingw32-make
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          # GCC's LTO wrapper needs the native make executable and an explicit
          # worker count on this Windows toolchain.
          export MAKE=mingw32-make
          qmake6 ../app.pro USE_QT=6 CONFIG+=release CONFIG-=debug_and_release CONFIG+=lto LTO_JOBS="$(nproc)"
          mingw32-make -j"$(nproc)"
          mingw32-make install
          python3 ../scripts/stage-resources.py --source .. --build-dir release --verify-windows release/target
          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_EXECUTABLE="+d["executable"]); print("PROJECT_RESOURCE_ROOT="+d["root"])' >> "$GITHUB_ENV"

      - name: Deploy with windeployqt
        run: |
          DEPLOY_DIR=release/target
          EXE="$DEPLOY_DIR/$PROJECT_EXECUTABLE.exe"

          cd _build
          # Deploy into the same folder that contains the executable
          # --release          → only release DLLs
          # --compiler-runtime → copy MinGW/UCRT runtime DLLs
          # --verbose 1        → useful log in the Actions output
          windeployqt6 \
            --release \
            --compiler-runtime \
            --no-translations \
            --no-opengl-sw \
            --verbose 1 \
            "$EXE"

          python3 ../scripts/deploy-qt-translations.py --source .. \
            --resources "$DEPLOY_DIR/$PROJECT_RESOURCE_ROOT" \
            --qt-translations "$(qmake6 -query QT_INSTALL_TRANSLATIONS)"

          echo "=== Collecting MSYS2 runtime dependencies ==="

          find "$DEPLOY_DIR" \
            \( -iname '*.exe' -o -iname '*.dll' \) \
            -print0 |
          while IFS= read -r -d '' binary; do
            ntldd -R "$binary" 2>/dev/null || true
          done |
          awk '$2 == "=>" {
            name=$1
            path=$3
            gsub(/\\/, "/", path)

            if (tolower(path) ~ /\/ucrt64\/bin\//)
              print name
          }' |
          sort -fu |
          while IFS= read -r dll; do
            src="/ucrt64/bin/$dll"

            if [ -f "$src" ]; then
              if [ ! -f "$DEPLOY_DIR/$dll" ]; then
                cp -a "$src" "$DEPLOY_DIR/"
                echo "Copied $dll"
              fi
            else
              echo "WARNING: unresolved MSYS2 dependency: $dll"
            fi
          done

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Windows-${{ github.sha }}
          path: _build/release/target/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Apple Silicon package (Qt 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt qttranslations sqlite libxml2 pkgconf python
      - name: Test resource staging and translation build
        run: |
          python3 tests/resources/test_resources.py
          python3 tests/resources/test_qt_translations.py
          python3 tests/resources/test_translation_build.py --qmake "$(brew --prefix qt)/bin/qmake"
      - name: Prepare external QtSingleApplication and build
        run: |
          set -euo pipefail
          qt_bin="$(brew --prefix qt)/bin"
          export PATH="$qt_bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig"
          dep_work="$RUNNER_TEMP/app-deps"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake "$qt_bin/qmake"
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          "$qt_bin/qmake" ../app.pro USE_QT=6 CONFIG+=release CONFIG-=debug_and_release CONFIG+=lto
          make -j"$(sysctl -n hw.ncpu)"
          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_VERSION="+d["version"]); print("PROJECT_EXECUTABLE="+d["executable"])' >> "$GITHUB_ENV"

      - name: Deploy, sign and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          qt_bin="$(brew --prefix qt)/bin"
          export PATH="$qt_bin:$PATH"
          cd _build/release/target
          bundle="$PROJECT_NAME.app"
          test -d "$bundle"
          test "$(uname -m)" = arm64
          lipo "$bundle/Contents/MacOS/$PROJECT_EXECUTABLE" -verify_arch arm64

          # Include the notices supplied by our external dependency helpers.
          mkdir -p "$bundle/Contents/Resources/licenses"
          cp -R "$RUNNER_TEMP/app-deps/install/share/licenses/qtsingleapplication" "$bundle/Contents/Resources/licenses/"
          cp -R "$RUNNER_TEMP/app-deps/miniaudio/share/licenses/miniaudio" "$bundle/Contents/Resources/licenses/"

          # Stage the plugin types used by this Widgets application. Keep all
          # image formats, but exclude the unused QML virtual keyboard.
          qt_plugins="$("$qt_bin/qmake" -query QT_INSTALL_PLUGINS)"
          deploy_args=(-no-plugins -verbose=2 -no-codesign)
          shopt -s nullglob
          for plugin_type in platforms printsupport styles tls networkinformation imageformats iconengines platforminputcontexts sqldrivers; do
            for plugin in "$qt_plugins/$plugin_type/"*.dylib; do
              plugin_name="${plugin##*/}"
              case "$plugin_name" in
                *_debug.dylib|libqtvirtualkeyboard*.dylib) continue ;;
              esac
              if [ "$plugin_type" = platforms ] && [ "$plugin_name" != libqcocoa.dylib ]; then
                continue
              fi
              mkdir -p "$bundle/Contents/PlugIns/$plugin_type"
              destination="$bundle/Contents/PlugIns/$plugin_type/$plugin_name"
              cp "$plugin" "$destination"
              deploy_args+=("-executable=$destination")
            done
          done

          # Homebrew installs Qt frameworks in separate formula directories.
          # Search them without copying modules that no retained binary uses.
          brew_prefix="$(brew --prefix)"
          deploy_args+=("-libpath=$brew_prefix/lib"
            "-libpath=$(brew --prefix sqlite)/lib"
            "-libpath=$(brew --prefix libxml2)/lib")
          for qt_lib in "$brew_prefix"/opt/qt*/lib; do
            [ -d "$qt_lib" ] && deploy_args+=("-libpath=$qt_lib")
          done
          "$qt_bin/macdeployqt" "$bundle" "${deploy_args[@]}"
          python3 "$GITHUB_WORKSPACE/scripts/deploy-qt-translations.py" \
            --source "$GITHUB_WORKSPACE" --resources "$bundle/Contents/Resources" \
            --qt-translations "$("$qt_bin/qmake" -query QT_INSTALL_TRANSLATIONS)"
          test -f "$bundle/Contents/PlugIns/platforms/libqcocoa.dylib"
          test -f "$bundle/Contents/PlugIns/sqldrivers/libqsqlite.dylib"

          # Some transitive Homebrew references survive deployment even when
          # their libraries were copied. Repair only references with an existing
          # bundle counterpart; never leave a dependency on the build machine.
          while IFS= read -r -d '' binary; do
            file_type="$(file -b "$binary")"
            [[ "$file_type" == *Mach-O* ]] || continue
            dependencies="$(otool -L "$binary")"
            install_id="$(otool -D "$binary" | tail -n +2)"
            while IFS= read -r dependency; do
              case "$dependency" in
                "$brew_prefix"/*|@rpath/*)
                  case "$dependency" in
                    @rpath/*) relative="${dependency#@rpath/}" ;;
                    *.framework/*) relative="${dependency#*/lib/}" ;;
                    *) relative="${dependency##*/}" ;;
                  esac
                  target="$bundle/Contents/Frameworks/$relative"
                  if [ ! -f "$target" ]; then
                    echo "Missing bundled dependency for $binary: $dependency" >&2
                    exit 1
                  fi
                  replacement="@executable_path/../Frameworks/$relative"
                  if [ "$dependency" = "$install_id" ]; then
                    install_name_tool -id "$replacement" "$binary"
                  else
                    install_name_tool -change "$dependency" "$replacement" "$binary"
                  fi
                  ;;
              esac
            done <<< "$(printf '%s\n' "$dependencies" | sed -n '2,$s/^[[:space:]]*\(.*\) (compatibility version.*$/\1/p')"
          done < <(find "$bundle" -type f -print0)

          # Signing does not check library availability. Reject missing
          # bundle-relative dependencies as well as build-host references.
          while IFS= read -r -d '' binary; do
            file_type="$(file -b "$binary")"
            [[ "$file_type" == *Mach-O* ]] || continue
            dependencies="$(otool -L "$binary")"
            while IFS= read -r dependency; do
              case "$dependency" in
                /System/Library/*|/usr/lib/*) continue ;;
                @executable_path/*)
                  target="$bundle/Contents/MacOS/${dependency#@executable_path/}" ;;
                @loader_path/*)
                  target="${binary%/*}/${dependency#@loader_path/}" ;;
                *)
                  echo "Unbundled dependency in $binary: $dependency" >&2
                  exit 1 ;;
              esac
              if [ ! -f "$target" ]; then
                echo "Missing bundled dependency for $binary: $dependency" >&2
                exit 1
              fi
            done <<< "$(printf '%s\n' "$dependencies" | sed -n '2,$s/^[[:space:]]*\(.*\) (compatibility version.*$/\1/p')"
          done < <(find "$bundle" -type f -print0)
          # All binary edits must precede signing. Deep signing is intentional
          # for this ad-hoc beta bundle, not a Developer ID/notarization workflow.
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          dmg_stage="$(mktemp -d "$RUNNER_TEMP/notquiterss-dmg.XXXXXX")"
          ditto "$bundle" "$dmg_stage/$bundle"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -volname "$PROJECT_NAME" -srcfolder "$dmg_stage" \
            -format UDZO "$PROJECT_NAME.dmg"
          hdiutil verify "$PROJECT_NAME.dmg"
          mkdir -p ../../artifacts
          mv "$PROJECT_NAME.dmg" "../../artifacts/$PROJECT_NAME-$PROJECT_VERSION-macOS-arm64.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-macOS-arm64-${{ github.sha }}
          path: _build/artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
