<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
  <title id="title">Green RSS badge with star</title>
  <desc id="desc">Glossy rounded green square with white RSS signal arcs and a gold star.</desc>
  <defs>
    <!-- Lighting only: geometry below is intentionally unchanged. -->
    <linearGradient id="bg" x1="80" y1="65" x2="1015" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79f43f"/>
      <stop offset=".24" stop-color="#35df42"/>
      <stop offset=".53" stop-color="#08c943"/>
      <stop offset=".80" stop-color="#00a14d"/>
      <stop offset="1" stop-color="#00824f"/>
    </linearGradient>
    <linearGradient id="rim" x1="85" y1="35" x2="1030" y2="1065" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cff4d"/>
      <stop offset=".18" stop-color="#54eb36"/>
      <stop offset=".55" stop-color="#05bc3b"/>
      <stop offset=".82" stop-color="#009b43"/>
      <stop offset="1" stop-color="#007a40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(247 159) rotate(42) scale(710 690)">
      <stop offset="0" stop-color="#e4ffc4" stop-opacity=".86"/>
      <stop offset=".20" stop-color="#b8ff91" stop-opacity=".54"/>
      <stop offset=".46" stop-color="#72f46b" stop-opacity=".20"/>
      <stop offset=".76" stop-color="#1abe63" stop-opacity=".05"/>
      <stop offset="1" stop-color="#008c55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white" x1="180" y1="185" x2="820" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".46" stop-color="#fdfdfd"/>
      <stop offset=".78" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#edf1f5"/>
    </linearGradient>
    <radialGradient id="gold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(807 188) rotate(52) scale(270 260)">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset=".16" stop-color="#fff58b"/>
      <stop offset=".42" stop-color="#ffe34a"/>
      <stop offset=".72" stop-color="#ffc01f"/>
      <stop offset="1" stop-color="#f39a08"/>
    </radialGradient>
    <filter id="blur" x="-25%" y="-25%" width="160%" height="170%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect x="21" y="27" width="1057" height="1041" rx="238" fill="url(#rim)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="url(#bg)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="url(#glow)"/>
  <path d="M85 251C85 135 183 51 293 51h510c141 0 253 114 253 254v90C957 213 847 155 695 155H305c-100 0-185 37-220 96Z" fill="#d7ffbe" opacity=".22" filter="url(#soft)"/>
  <rect x="43" y="50" width="1013" height="990" rx="208" fill="none" stroke="#c4ff9d" stroke-opacity=".26" stroke-width="2"/>

  <!-- Continuous RSS bands: circular inner/outer contours with integrated rounded-rectangle terminals -->
  <g transform="translate(0 13)" opacity=".36" fill="#004b2c" filter="url(#blur)">
    <path d="M202.55 207.50 A662.5 662.5 0 0 1 859.49 880.01 L859.49 881 Q859.49 924 816.49 924 H769.51 Q726.51 924 726.51 881 L726.51 877.99 A529.5 529.5 0 0 0 201.45 340.50 L198 340.50 Q155 340.50 155 297.50 V250.50 Q155 207.50 198 207.50 Z"/><path d="M204.58 419.55 A448.5 448.5 0 0 1 635.47 880.97 L635.47 881 Q635.47 924 592.47 924 H545.53 Q502.53 924 502.53 881 L502.53 877.03 A315.5 315.5 0 0 0 199.42 552.45 L198 552.45 Q155 552.45 155 509.45 V462.55 Q155 419.55 198 419.55 Z"/><circle cx="265" cy="793" r="120"/>
  </g>
  <g fill="url(#white)">
    <path d="M202.55 207.50 A662.5 662.5 0 0 1 859.49 880.01 L859.49 881 Q859.49 924 816.49 924 H769.51 Q726.51 924 726.51 881 L726.51 877.99 A529.5 529.5 0 0 0 201.45 340.50 L198 340.50 Q155 340.50 155 297.50 V250.50 Q155 207.50 198 207.50 Z"/><path d="M204.58 419.55 A448.5 448.5 0 0 1 635.47 880.97 L635.47 881 Q635.47 924 592.47 924 H545.53 Q502.53 924 502.53 881 L502.53 877.03 A315.5 315.5 0 0 0 199.42 552.45 L198 552.45 Q155 552.45 155 509.45 V462.55 Q155 419.55 198 419.55 Z"/><circle cx="265" cy="793" r="120"/>
  </g>

  <!-- Star shadow and star -->
  <path d="M831 148c8 0 14 4 18 13l31 75c2 4 5 6 10 6l80 2c18 0 25 22 11 33l-63 49c-4 3-5 6-4 11l21 77c5 17-14 30-29 20l-66-43c-4-3-8-3-12 0l-66 43c-15 10-34-3-29-20l21-77c1-5 0-8-4-11l-63-49c-14-11-7-33 11-33l80-2c5 0 8-2 10-6l31-75c4-9 10-13 18-13Z" transform="translate(0 13)" fill="#00452b" opacity=".40" filter="url(#blur)"/>
  <path d="M831 148c8 0 14 4 18 13l31 75c2 4 5 6 10 6l80 2c18 0 25 22 11 33l-63 49c-4 3-5 6-4 11l21 77c5 17-14 30-29 20l-66-43c-4-3-8-3-12 0l-66 43c-15 10-34-3-29-20l21-77c1-5 0-8-4-11l-63-49c-14-11-7-33 11-33l80-2c5 0 8-2 10-6l31-75c4-9 10-13 18-13Z" fill="url(#gold)" stroke="#e8a300" stroke-width="5" stroke-linejoin="round"/>
</svg>
