; Article sharing services. The order list controls menu order.
; Supported placeholders are {url} and {title}; both are percent-encoded.
; Icon values are filenames relative to the social-networks directory.

[services]
order=email, facebook, x, vk, linkedin, reddit, hackernews, telegram

[email]
name=Email
action=emailShareAct
icon=email.png
url=mailto:?subject={title}&body={url}

[facebook]
name=Facebook
action=facebookShareAct
icon=facebook.com.png
url=https://www.facebook.com/sharer/sharer.php?u={url}

[x]
name=X
action=twitterShareAct
icon=x.com.png
url=https://twitter.com/intent/tweet?url={url}&text={title}

[vk]
name=VK
action=vkShareAct
icon=vk.com.png
url=https://vk.com/share.php?url={url}&title={title}

[linkedin]
name=LinkedIn
action=linkedinShareAct
icon=linkedin.com.png
url=https://www.linkedin.com/sharing/share-offsite/?url={url}

[reddit]
name=Reddit
action=redditShareAct
icon=reddit.com.ico
url=https://www.reddit.com/submit?url={url}&title={title}

[hackernews]
name=Hacker News
action=hackerNewsShareAct
icon=news.ycombinator.com.png
url=https://news.ycombinator.com/submitlink?u={url}&t={title}

[telegram]
name=Telegram
action=telegramShareAct
icon=telegram.org.png
url=https://t.me/share/url?url={url}&text={title}
